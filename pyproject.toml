[project]
name = "picview"
version = "0.0.2"
description = "A lightweight Windows image folder viewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "tkinterdnd2>=0.4.3",
    "customtkinter>=5.2.2",
    "pyside6>=6.8",
]

[project.scripts]
picview = "picview.qt_app:main"

[project.urls]
Homepage = "https://github.com/codemee/picview"
Repository = "https://github.com/codemee/picview"
Issues = "https://github.com/codemee/picview/issues"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller>=6.22,<7",
]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
