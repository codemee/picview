[project]
name = "picview"
version = "0.1.0"
description = "A lightweight Windows image folder viewer"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "tkinterdnd2>=0.4.3",
    "customtkinter>=5.2.2",
    "pyside6>=6.8",
]

[project.scripts]
picview = "picview.qt_app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
